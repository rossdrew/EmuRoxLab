name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Roundabout comes from GitHub Packages (public rossdrew/roundabout), which still needs a token to read;
# this workflow's own token with packages: read is enough
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test

  coverage:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate JaCoCo report
        run: ./gradlew clean test jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml

  mutation:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    if: contains(github.event.head_commit.message, '+fullBuild') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Mutation tests
        run: ./gradlew pitest

      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest

  # main only: the badge (badges branch) and the report site for Pages. A job of its own, so the
  # token that can push never meets the build or its dependencies
  badge:
    runs-on: ubuntu-latest
    needs: mutation
    continue-on-error: true
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download PIT report
        uses: actions/download-artifact@v4
        with:
          name: pitest-report
          path: pitest

      - name: Badge and report site
        uses: rossdrew/PitestCI@v1
        with:
          reports: pitest/mutations.xml
          report: true
          publish: true

  # the report at https://rossdrew.github.io/EmuRoxLab/pitest/
  pages:
    runs-on: ubuntu-latest
    needs: badge
    continue-on-error: true

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy PIT report to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Generate dependency graph
        uses: gradle/actions/dependency-submission@v5